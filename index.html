<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8" />

<title>For My Forever</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Georgia', serif;

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #ffffff;
    text-align: center;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('hands-forever.jpg') right center / cover no-repeat;
    filter: blur(5px);
    transform: scale(1.15);
    z-index: -2;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(0,0,0,0.1), rgba(0,0,0,0.5));
    z-index: -1;
  }

  body.celebrate::before,
  body.celebrate::after {
    display: none;
  }

  }

    font-size: 1rem;
    border: none;
    border-radius: 30px;
    margin: 8px;

  }

    min-height: 24px;
  }
